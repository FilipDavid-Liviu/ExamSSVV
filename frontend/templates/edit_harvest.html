{% extends "base.html" %}
{% block title %}Edit Harvest - Farm System{% endblock %}
{% block content %}
<article>
    <header>
        <h2>Edit Harvest</h2>
    </header>
    <form action="/harvests/{{ harvest.id }}/update" method="post">
        <label for="field_id">Field
            <select name="field_id" id="field_id" required>
                {% for field in fields %}
                <option value="{{ field.id }}" {% if field.id == harvest.field_id %}selected{% endif %}>{{ field.name }}</option>
                {% endfor %}
            </select>
        </label>

        <label for="crop_id">Crop
            <select name="crop_id" id="crop_id" required>
                {% for crop in crops %}
                <option value="{{ crop.id }}" {% if crop.id == harvest.crop_id %}selected{% endif %}>{{ crop.name }}</option>
                {% endfor %}
            </select>
        </label>

        <label for="harvest_date">Harvest Date
            <input type="date" name="harvest_date" id="harvest_date" value="{{ harvest.harvest_date }}" required>
        </label>

        <label for="actual_yield_tons">Actual Yield (Tons)
            <input type="number" step="0.1" min="0" name="actual_yield_tons" id="actual_yield_tons" value="{{ harvest.actual_yield_tons }}" required>
        </label>

        <label for="quality_rating">Quality Rating (1-5)
            <input type="number" min="1" max="5" step="1" name="quality_rating" id="quality_rating" value="{{ harvest.quality_rating }}" required>
        </label>

        <button type="submit">Update Harvest</button>
    </form>
</article>
{% endblock %}
