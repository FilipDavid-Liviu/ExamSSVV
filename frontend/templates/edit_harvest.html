{% extends "base.html" %}
{% block title %}Edit Harvest Record - AgriKeep{% endblock %}
{% block content %}
<article style="max-width: 600px; margin: 0 auto;">
    <header>
        <h2>
            <i class="bi bi-pencil-square" style="color: var(--farm-emerald);"></i>
            Edit Harvest Record
        </h2>
    </header>
    <form action="/harvests/{{ harvest.id }}/update" method="post">
        <label for="field_id">
            <span>Select Cultivated Field</span>
            <select name="field_id" id="field_id" required>
                {% for field in fields %}
                <option value="{{ field.id }}" {% if field.id == harvest.field_id %}selected{% endif %}>{{ field.name }} ({{ field.size_hectares }} ha - {{ field.soil_type }} soil)</option>
                {% endfor %}
            </select>
        </label>

        <label for="crop_id">
            <span>Select Harvested Crop</span>
            <select name="crop_id" id="crop_id" required>
                {% for crop in crops %}
                <option value="{{ crop.id }}" {% if crop.id == harvest.crop_id %}selected{% endif %}>{{ crop.name }} ({{ crop.season }} variety)</option>
                {% endfor %}
            </select>
        </label>

        <label for="harvest_date">
            <span>Harvest Record Date</span>
            <input type="date" name="harvest_date" id="harvest_date" value="{{ harvest.harvest_date }}" required>
        </label>

        <label for="actual_yield_tons">
            <span>Actual Yield Quantity (Tons)</span>
            <input type="number" step="0.1" min="0" name="actual_yield_tons" id="actual_yield_tons" value="{{ harvest.actual_yield_tons }}" required>
        </label>

        <label for="quality_rating">
            <span>Harvest Quality Rating (1 to 5 Stars)</span>
            <input type="number" min="1" max="5" step="1" name="quality_rating" id="quality_rating" value="{{ harvest.quality_rating }}" required>
        </label>

        <button type="submit">
            <i class="bi bi-check-lg"></i> Update Harvest Record
        </button>
    </form>
    
    <div style="text-align: center; margin-top: 1.5rem; border-top: 1px solid #f2f6f3; padding-top: 1rem;">
        <a href="/harvests" style="color: var(--farm-text-muted); font-size: 0.9rem; text-decoration: none;">
            <i class="bi bi-arrow-left"></i> Cancel & Return to Harvests
        </a>
    </div>
</article>
{% endblock %}
