{% extends "base.html" %}
{% block title %}{% if field %}Edit Field{% else %}Register New Field{% endif %} - AgriKeep{% endblock %}
{% block content %}
<article style="max-width: 600px; margin: 0 auto;">
    <header>
        <h2>
            <i class="bi {% if field %}bi-pencil-square{% else %}bi-plus-circle-fill{% endif %}" style="color: var(--farm-emerald);"></i>
            {% if field %}Edit Field Registry{% else %}Register New Field{% endif %}
        </h2>
    </header>
    <form action="{% if field %}/fields/{{ field.id }}/update{% else %}/fields{% endif %}" method="post">
        <label for="name">
            <span>Field Name</span>
            <input type="text" name="name" id="name" placeholder="e.g. North Pasture, Hillside Valley" value="{% if field %}{{ field.name }}{% endif %}" required>
        </label>

        <label for="size_hectares">
            <span>Field Area Size (Hectares)</span>
            <input type="number" step="0.1" min="0" name="size_hectares" id="size_hectares" placeholder="e.g. 15.0" value="{% if field %}{{ field.size_hectares }}{% endif %}" required>
        </label>

        <label for="soil_type">
            <span>Soil Classification Type</span>
            <input type="text" name="soil_type" id="soil_type" placeholder="e.g. Loamy, Sandy, Clay" value="{% if field %}{{ field.soil_type }}{% endif %}" required>
        </label>

        <button type="submit">
            <i class="bi bi-check-lg"></i> {% if field %}Update Field{% else %}Create Field{% endif %}
        </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; border-top: 1px solid #f2f6f3; padding-top: 1rem;">
        <a href="/fields" style="color: var(--farm-text-muted); font-size: 0.9rem; text-decoration: none;">
            <i class="bi bi-arrow-left"></i> Cancel & Return to Fields List
        </a>
    </div>
</article>
{% endblock %}
